# cargo-deny configuration, following ZeroClaw's policy: advisories,
# licenses, duplicate versions denied (with recorded exceptions) and
# crates.io as the only source.
# Run: cargo deny check

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"

# Transitive duplicates the client cannot unify; drop each when upstream does.
[[bans.skip]]
name = "getrandom"
version = "=0.3.4"
reason = "rand 0.9 (via tokio-tungstenite) still uses getrandom 0.3"

[[bans.skip]]
name = "r-efi"
version = "=5.3.0"
reason = "pulled by getrandom 0.3 (above)"

[[bans.skip]]
name = "syn"
version = "=2.0.119"
reason = "proc-macro crates are mid-way from syn 2 to syn 3"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
